name: Feature request
description: Propose a focused improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Explain the workflow or ambiguity this should address.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: dropdown
    id: compatibility
    attributes:
      label: Does this change an existing Tool field or state meaning?
      options:
        - No
        - Yes
        - Unsure
    validations:
      required: true
